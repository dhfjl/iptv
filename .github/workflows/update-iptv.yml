name: Update IPTV Playlist

on:
  schedule:
    # 每月 1 日 UTC 00:30，即北京时间约 08:30
    - cron: "30 0 1 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-iptv-playlist
  cancel-in-progress: false

jobs:
  update-playlist:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Generate playlist with logo and EPG
        run: python scripts/update_iptv.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add iptv.m3u

          if git diff --cached --quiet; then
            echo "播放列表没有变化"
            exit 0
          fi

          git commit -m "chore: update IPTV playlist"
          git push
